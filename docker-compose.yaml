version: '3.8'

services:
  traefik:
    image: traefik:v3.0
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.error-pages.errors.status=500-599"
      - "traefik.http.middlewares.error-pages.errors.service=dashboard"
      - "traefik.http.middlewares.error-pages.errors.query=/error"
    networks:
      - workspace-net

  proxy-service:
    build: ../proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`localhost`)"
      - "traefik.http.routers.dashboard.entrypoints=web"
      - "traefik.http.services.dashboard.loadbalancer.server.port=80"
    networks:
      - workspace-net

  placeholder1-service:
    build: ../applications/placeholder1-service
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.service1.rule=Host(`service1.localhost`)"
      - "traefik.http.routers.service1.entrypoints=web"
      - "traefik.http.routers.service1.middlewares=error-pages"
      - "traefik.http.services.service1.loadbalancer.server.port=8081"
    depends_on:
      - postgres
    networks:
      - workspace-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  placeholder2-service:
    build: ../applications/placeholder2-service
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.service2.rule=Host(`service2.localhost`)"
      - "traefik.http.routers.service2.entrypoints=web"
      - "traefik.http.routers.service2.middlewares=error-pages"
      - "traefik.http.services.service2.loadbalancer.server.port=8082"
    depends_on:
      - postgres
    networks:
      - workspace-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: workspace_db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    networks:
      - workspace-net

networks:
  workspace-net:
    driver: bridge
